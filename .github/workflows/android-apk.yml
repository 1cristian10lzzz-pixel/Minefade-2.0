name: Minefade Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minefade-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Tests and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform, Build Tools, NDK and CMake
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          cmake --version

      - name: Set up Rust stable and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          rustc --version
          cargo --version
          rustup target list --installed
          sdkmanager --list_installed

      - name: Install Python test runner
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest

      - name: Verify deterministic audio, catalog and atlas
        shell: bash
        run: |
          python3 tools/generate_audio.py
          python3 tools/generate_block_catalog.py
          git add -- \
            app/src/main/assets/audio \
            app/src/main/assets/data/minefade_block_catalog.json \
            app/src/main/assets/textures/block_atlas.rgba \
            app/src/main/cpp/blocks/BlockRegistry.h \
            app/src/main/cpp/blocks/BlockRegistry.cpp \
            docs/block_atlas_preview.png \
            docs/BLOCK_CATALOG_1_8.md
          if ! git diff --cached --quiet; then
            echo "Generated Minefade assets are stale. Run the generators locally and commit their output before opening a PR." >&2
            git diff --cached --stat
            exit 1
          fi

      - name: Run Python regression tests
        run: python3 -m pytest -q tests

      - name: Run Rust and native C++ regression tests
        shell: bash
        run: bash tests/run-world-tests.sh

      - name: Build installable Android debug APK (ARM64 + ARMv7)
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and create checksum
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" > dist/apk-badging.txt
          sed -n "1,8p" dist/apk-badging.txt
          cp "$APK" "dist/Minefade-2.0-debug-${GITHUB_RUN_NUMBER}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Minefade-2.0-APK-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  draft-prerelease:
    name: Draft Android prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated APK artifact
        uses: actions/download-artifact@v7
        with:
          name: Minefade-2.0-APK-${{ github.run_number }}
          path: dist

      - name: Create draft prerelease
        uses: softprops/action-gh-release@v3
        with:
          name: Minefade ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            APK generado automáticamente desde el commit ${{ github.sha }}.

            **Tipo de paquete:** debug firmado por Android Gradle Plugin.
            **ABI incluidas:** arm64-v8a y armeabi-v7a.
            **Versionado Android:** versionCode 24 / versionName 2.1.0.

            Esta es una compilación de validación. La firma debug generada por un runner no garantiza que pueda instalarse como actualización sobre otro APK firmado con una clave diferente. Antes de declarar una versión estable, configura una clave de distribución persistente y prueba la actualización y los mundos guardados en dispositivos Android reales.
